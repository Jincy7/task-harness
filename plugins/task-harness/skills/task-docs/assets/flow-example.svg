  <g fill="#ffffff" stroke="#30433b" stroke-width="2">
    <rect x="30" y="55" width="170" height="70" rx="10"/>
    <rect x="275" y="55" width="170" height="70" rx="10"/>
    <rect x="520" y="55" width="170" height="70" rx="10"/>
    <path d="M200 90 H263 M253 83 L263 90 L253 97 M445 90 H508 M498 83 L508 90 L498 97" fill="none"/>
  </g>
  <g fill="#20372b" font-family="sans-serif" font-size="20" text-anchor="middle">
